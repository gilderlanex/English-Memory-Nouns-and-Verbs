<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Memory Verbs and Nouns</title>
    <!-- Modern Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>🧠 English Memory Verbs and Nouns</h1>
            <p>Aprenda verbos e substantivos no contexto certo.</p>
        </header>

        <nav class="app-nav">
            <button class="nav-btn active" data-target="dictionary-view">📚 Dicionário</button>
            <button class="nav-btn" data-target="exercise-view">🎯 Exercícios</button>
        </nav>

        <main class="app-main">
            
            <!-- View: Dictionary -->
            <section id="dictionary-view" class="view active-view">
                <div class="filters">
                    <label for="category-filter">Categoria:</label>
                    <select id="category-filter">
                        <option value="all">Todas</option>
                        <!-- Options populated by JS -->
                    </select>

                    <label for="type-filter-dict" style="margin-left: 15px;">Tipo:</label>
                    <select id="type-filter-dict">
                        <option value="all">Todos</option>
                        <option value="verb">Verbos</option>
                        <option value="noun">Substantivos</option>
                    </select>
                </div>

                <div class="verb-list" id="verb-list-container">
                    <!-- Verb cards populated by JS -->
                </div>
            </section>

            <!-- View: Exercises -->
            <section id="exercise-view" class="view">
                <div class="exercise-container">
                    <div class="exercise-header">
                        <span class="category-badge" id="exercise-category">Categoria</span>
                        <div class="score">Acertos: <span id="score-count">0</span></div>
                    </div>

                    <div class="filters" style="justify-content: center; margin-bottom: 20px;">
                        <label for="type-filter">Treinar:</label>
                        <select id="type-filter">
                            <option value="all">Verbos e Substantivos</option>
                            <option value="verb">Apenas Verbos</option>
                            <option value="noun">Apenas Substantivos</option>
                        </select>
                    </div>

                    <div class="flashcard" id="flashcard">
                        <div class="card-inner">
                            <!-- Front of the card (Question) -->
                            <div class="card-front">
                                <h2 class="portuguese-hint" id="pt-hint">Tradução</h2>
                                <p class="sentence-context" id="sentence-en">The sentence goes here with a ___.</p>
                                
                                <form id="answer-form">
                                    <input type="text" id="verb-input" placeholder="Digite o verbo em inglês..." autocomplete="off" required>
                                    <button type="submit" class="btn primary">Verificar</button>
                                </form>
                                <div class="feedback" id="feedback-msg"></div>
                            </div>

                            <!-- Back of the card (Answer & Translation) -->
                            <div class="card-back">
                                <h2>Resposta Correta:</h2>
                                <div style="display: flex; justify-content: center; align-items: center; gap: 10px;">
                                    <h1 class="correct-verb" id="correct-verb-display">Verb</h1>
                                    <button id="audio-btn-exercise" style="background: none; border: none; cursor: pointer; font-size: 1.5rem;">🔊</button>
                                </div>
                                <p class="sentence-translation" id="sentence-pt">Tradução da frase completa.</p>
                                <button id="next-btn" class="btn secondary">Próximo Verbo ➔</button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
